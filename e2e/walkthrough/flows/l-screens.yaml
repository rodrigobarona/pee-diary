# Screenshots in the app's language (LOCALE=pt|es), after w1 and w2 restored
# a backup in that language. No video. Same screen names as the English
# chapters so the website import can use them.
appId: care.eleva.peediary
---
- takeScreenshot: 20-today-top
- scroll
- scroll
- takeScreenshot: 22-today-lower
- scrollUntilVisible:
    element:
      text: "${MONTH}"
    direction: UP
- tapOn:
    text: "${MONTH}"
- waitForAnimationToEnd
- takeScreenshot: 22b-today-month
- tapOn:
    text: "${WEEK}"
- waitForAnimationToEnd
# History
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          point: "75%,93%"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "tab-history"
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "${DAY}"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "history-day-${DAY_KEY}"
- waitForAnimationToEnd
- takeScreenshot: 31-history-day
- scrollUntilVisible:
    element:
      id: "entry-5a9a4b54-727a-4aa2-9c15-b854019f5d5a"
    direction: DOWN
- tapOn:
    id: "entry-5a9a4b54-727a-4aa2-9c15-b854019f5d5a"
- extendedWaitUntil:
    visible:
      id: "form-save"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 33-entry-detail
- runFlow: close-form.yaml
# The three forms, closed without saving
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          point: "25%,93%"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "tab-today"
- waitForAnimationToEnd
- tapOn:
    id: "add-entry-button"
- extendedWaitUntil:
    visible:
      id: "add-menu-urination"
    timeout: 10000
- tapOn:
    id: "add-menu-urination"
- extendedWaitUntil:
    visible:
      id: "form-save"
    timeout: 10000
- waitForAnimationToEnd
- waitForAnimationToEnd
- tapOn:
    text: "${LARGE}.*"
    optional: true
- takeScreenshot: 42-add-urination-filled
- runFlow: close-form.yaml
- tapOn:
    text: "(?i)${DISCARD}.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "add-entry-button"
- extendedWaitUntil:
    visible:
      id: "add-menu-fluid"
    timeout: 10000
- tapOn:
    id: "add-menu-fluid"
- extendedWaitUntil:
    visible:
      id: "form-save"
    timeout: 10000
- waitForAnimationToEnd
- waitForAnimationToEnd
- tapOn:
    text: "${TEA}.*"
    optional: true
- takeScreenshot: 44-add-fluid
- runFlow: close-form.yaml
- tapOn:
    text: "(?i)${DISCARD}.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "add-entry-button"
- extendedWaitUntil:
    visible:
      id: "add-menu-leak"
    timeout: 10000
- tapOn:
    id: "add-menu-leak"
- extendedWaitUntil:
    visible:
      id: "form-save"
    timeout: 10000
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: 45-add-leak
- runFlow: close-form.yaml
- tapOn:
    text: "(?i)${DISCARD}.*"
    optional: true
- waitForAnimationToEnd
# Settings and its sheets
- tapOn:
    id: "settings-button"
- waitForAnimationToEnd
- takeScreenshot: 10-settings-top
- tapOn:
    id: "settings-row-goals"
- waitForAnimationToEnd
- takeScreenshot: 50-goals
- runFlow: dismiss-sheet.yaml
- tapOn:
    id: "settings-row-language"
- waitForAnimationToEnd
- takeScreenshot: 51-language
- runFlow: dismiss-sheet.yaml
- tapOn:
    id: "settings-row-reminders"
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 53-reminders-on
- scrollUntilVisible:
    element:
      id: "settings-row-export"
    direction: DOWN
- tapOn:
    id: "settings-row-export"
- waitForAnimationToEnd
- takeScreenshot: 54-export
- runFlow: dismiss-sheet.yaml
# The welcome screen, replayed from Settings
- scrollUntilVisible:
    element:
      id: "settings-row-tutorial"
    direction: UP
- tapOn:
    id: "settings-row-tutorial"
- extendedWaitUntil:
    visible:
      id: "onboarding-next"
    timeout: 10000
# Known app issue: replayed after the language changed in the same session,
# the onboarding can keep showing the previous language. If this screenshot
# comes out in the wrong language, retake it after relaunching the app.
- tapOn:
    id: "onboarding-next"
- waitForAnimationToEnd
- tapOn:
    id: "onboarding-back"
- waitForAnimationToEnd
- takeScreenshot: 01-welcome

# Chapter 1: first launch, the three onboarding pages, empty Today
appId: care.eleva.peediary
---
# iOS: a fresh start in the walkthrough's language and region (the app
# follows the device)
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
          arguments:
            AppleLanguages: "(${LANG_CODE})"
            AppleLocale: "${LOCALE_ID}"
# Android: run.sh already cleared the app's data and set its language
# (clearing here would also reset the language)
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp
- extendedWaitUntil:
    visible:
      id: "onboarding-next"
    timeout: 90000
- waitForAnimationToEnd
- startRecording: 01-onboarding
- takeScreenshot: 01-welcome
- tapOn:
    id: "onboarding-next"
- waitForAnimationToEnd
- takeScreenshot: 02-welcome-track
- tapOn:
    id: "onboarding-next"
- waitForAnimationToEnd
- takeScreenshot: 03-welcome-share
- tapOn:
    id: "onboarding-get-started"
- waitForAnimationToEnd
- runFlow: dismiss-launch-menu.yaml
- takeScreenshot: 04-today-empty
- stopRecording

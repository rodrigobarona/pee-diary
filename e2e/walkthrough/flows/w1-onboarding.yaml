# Chapter 1: first launch, the three onboarding pages, empty Today
appId: care.eleva.peediary
---
- launchApp:
    clearState: true
    # iOS: start in the walkthrough's language (the app follows the device)
    arguments:
      AppleLanguages: "(${LANG_CODE})"
      # And that language's region, so numbers and dates look native
      AppleLocale: "${LOCALE_ID}"
- extendedWaitUntil:
    visible:
      id: "onboarding-next"
    timeout: 90000
- waitForAnimationToEnd
- startRecording: 01-onboarding
- takeScreenshot: 01-welcome
- tapOn:
    id: "onboarding-next"
- waitForAnimationToEnd
- takeScreenshot: 02-welcome-track
- tapOn:
    id: "onboarding-next"
- waitForAnimationToEnd
- takeScreenshot: 03-welcome-share
- tapOn:
    id: "onboarding-get-started"
- waitForAnimationToEnd
- runFlow: dismiss-launch-menu.yaml
- takeScreenshot: 04-today-empty
- stopRecording

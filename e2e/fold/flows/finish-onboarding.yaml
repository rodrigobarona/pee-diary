# If the welcome pages are showing (a tutorial left half-way), finish them
appId: care.eleva.peediary
---
- runFlow:
    when:
      visible:
        id: "onboarding-skip"
    commands:
      - tapOn:
          id: "onboarding-skip"
      - waitForAnimationToEnd
      - tapOn:
          id: "onboarding-get-started"
      - waitForAnimationToEnd

# Fold continuity, onboarding pager: open the tutorial on page 2 at phone width
appId: care.eleva.peediary
---
# Window mode keeps the app in the freeform window it was started in
- runFlow:
    when:
      true: ${RELAUNCH == 'true'}
    commands:
      - launchApp
- runFlow:
    when:
      true: ${RELAUNCH != 'true'}
    commands:
      - launchApp:
          stopApp: false
- runFlow: finish-onboarding.yaml
- runFlow: ../../walkthrough/flows/dismiss-launch-menu.yaml
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "settings-row-tutorial"
- tapOn:
    id: "settings-row-tutorial"
- tapOn:
    id: "onboarding-next"
- waitForAnimationToEnd
- takeScreenshot: tutorial-start

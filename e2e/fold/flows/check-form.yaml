# Fold continuity, after the window changed size: the same form, amount and
# note are still there (no restart, nothing lost)
appId: care.eleva.peediary
---
- extendedWaitUntil:
    visible:
      id: "form-save"
    timeout: 10000
- waitForAnimationToEnd
# The note may be scrolled out of view after the change: find it
- scrollUntilVisible:
    element: "Fold test note"
# The drink type (Water, the default) and the amount are still chosen
- scrollUntilVisible:
    element: "330"
    direction: UP
# Android exposes the chosen drink as a checked radio button
- scrollUntilVisible:
    element:
      text: "Water"
      checked: true
    direction: UP
- takeScreenshot: ${STEP}

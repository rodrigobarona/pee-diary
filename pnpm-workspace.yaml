# Mirrors the Eleva monorepo's pnpm settings so this app can move into it later.
autoInstallPeers: true

# NativeWind 5 RC is tested against these exact lightningcss and postcss
# releases. pnpm does not deduplicate a direct pin, so pin them tree-wide.
overrides:
  lightningcss: 1.30.1
  postcss: 8.5.6

allowBuilds:
  "@tailwindcss/oxide": true
  # Has no install script to run; listed so pnpm does not stop the install.
  unrs-resolver: false

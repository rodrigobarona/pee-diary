# Mirrors the Eleva monorepo's pnpm settings so this app can move into it later.
autoInstallPeers: true

# NativeWind 5 RC is tested with lightningcss 1.30.1 and postcss 8.5.6.
# postcss is pinned only for the Tailwind PostCSS plugin; Expo's Metro
# config keeps the newer patch release it asks for.
overrides:
  lightningcss: 1.30.1
  "@tailwindcss/postcss>postcss": 8.5.6
  # One copy of each native module in the build (expo-asset kept an older one).
  expo-constants: ~57.0.24

allowBuilds:
  "@tailwindcss/oxide": true
  # Has no install script to run; listed so pnpm does not stop the install.
  unrs-resolver: false
